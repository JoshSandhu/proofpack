# A-P3 (build day 9, lane A): weekly update pull requests for the Python lock, the
# workflow actions and the Dockerfile's base image. After main reached 78ae8dc
# (24 September 2026) `gh run list` showed CI runs on the branches dependabot/uv/*,
# dependabot/github_actions/* and dependabot/docker/python-3.14-slim. GitHub's
# documentation of the "uv" ecosystem was not read in this build. The python 3.12-slim to
# 3.14-slim update would change D1 section 9's reference platform (python:3.12-slim,
# linux/amd64).
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    # The oracle capture (fixtures/oracles_v1.json) records numpy, scipy, scikit-learn and
    # statsmodels in library_versions. PR #7 (scikit-learn 1.9.0 to 1.9.1) failed
    # test_capture_check_exits_0_on_the_committed_oracles on 5 Oct 2026; the other three
    # were not measured and are held for the same reason. Move any of them only together
    # with a fresh oracle capture.
    ignore:
      - dependency-name: "numpy"
      - dependency-name: "scipy"
      - dependency-name: "scikit-learn"
      - dependency-name: "statsmodels"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"

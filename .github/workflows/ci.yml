name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  UV_VERSION: "0.8.17"
  PYTHON_VERSION: "3.12"

jobs:
  test:
    name: pytest + ruff
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --all-groups --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: pytest (all markers)
        run: uv run pytest -q -p no:cacheprovider
      # A-P3 repair 3 (CI-1): the --check tests/test_fixtures_cmd.py runs, here outside
      # pytest. It is written to print each captured value whose float differs from
      # fixtures/oracles_v1.json, with both figures. In GitHub Actions run 36020197050
      # (commit 81f1102, 24 September 2026) this step succeeded and printed
      # "captured.F3-delong.values.paired_p: committed 0.0593464387919198 fresh
      # 0.05934643879191981 abs difference 6.939e-18 iterative tolerance 1e-06 within" and
      # "captured values: 64 identical, 1 differ within their tolerance, 0 differ outside it"
      # (read from the run log on 2 October 2026). The
      # step name, the command and the if: line are read by tests/test_ap3_r3_repair1.py::
      # test_fan7_the_oracle_step_follows_pytest_and_carries_if_not_cancelled.
      - name: oracle capture compared with fixtures/oracles_v1.json
        if: ${{ !cancelled() }}
        run: uv run python scripts/capture_fixture_oracles.py --check
      # Definition of done, per day. The marker list is read out of pyproject.toml
      # rather than typed here, so adding "dayN" to [tool.pytest.ini_options].markers
      # is enough to gate that day. tests/test_invariants.py asserts (a) every
      # collected test carries a dayN marker, so a new day's tests cannot hide from
      # this loop, and (b) that this step stays list-free.
      - name: pytest every declared day marker (definition of done)
        run: |
          set -euo pipefail
          days=$(uv run python -c "
          import re, tomllib
          with open('pyproject.toml','rb') as fh:
              markers = tomllib.load(fh)['tool']['pytest']['ini_options']['markers']
          names = {m.split(':',1)[0] for m in markers}
          days = sorted((d for d in names if re.fullmatch(r'day\d+', d)), key=lambda s: int(s[3:]))
          print(' '.join(days))
          ")
          echo "day markers declared: $days"
          for d in $days; do
            echo "::group::pytest -m $d"
            set +e
            uv run pytest -q -p no:cacheprovider -m "$d"
            rc=$?
            set -e
            # exit 5 = no tests collected: a declared-but-not-yet-built day. Any other
            # non-zero code is a real failure.
            if [ "$rc" -eq 5 ]; then
              echo "no tests yet for $d"
            elif [ "$rc" -ne 0 ]; then
              exit "$rc"
            fi
            echo "::endgroup::"
          done
      - name: doctor in the CI venv
        run: uv run proofpack doctor --offline

  docx-extra:
    # A-P4 (build day 10, lane A): this job is written to install the [docx] extra (docxtpl,
    # python-docx, matplotlib) from the lock and run the ap4 marker with
    # PROOFPACK_REQUIRE_DOCX=1, the variable under which tests/ap4_docx.py::needs_extra
    # refuses the "extra not installed" skip; the main test job is written without the
    # extra. This job had not run in CI on 2 October 2026 (the branch a-p4-docx had not been
    # pushed). Measured locally at commit 4879ac5 (its 130 ap4 tests) with the three modules
    # hidden (win-amd64-cp314, 26 September 2026; lens 2 re-measured the same counts there
    # on 2 October 2026): -m ap4 gave 29 passed, 101 skipped without the variable and 23
    # failed, 47 passed, 60 errors with it (tests/ap4_docx.py's docstring).
    # The install is a download GitHub makes on its runner.
    name: pytest -m ap4 with the [docx] extra installed
    runs-on: ubuntu-24.04
    env:
      PROOFPACK_REQUIRE_DOCX: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --all-groups --locked --extra docx
      - name: the three modules import (the skip is refused under PROOFPACK_REQUIRE_DOCX)
        run: uv run python -c "import docx, docxtpl, matplotlib; print(docxtpl.__version__, matplotlib.__version__)"
      - name: pytest -m ap4 (the DOCX renderer, templates, figures, round-trip, styles)
        run: uv run pytest -q -p no:cacheprovider -m ap4
      - name: "proofpack run --format json,html,docx on the synthetic sample (no licence: exit 4, run.json only, the Next-step line names the .docx files)"
        run: |
          set -euo pipefail
          uv run python scripts/f17_determinism.py --out smoke/in --n 400 --inputs-only
          set +e
          uv run proofpack run --input smoke/in/synthetic.csv --criteria smoke/in/criteria.yaml --mapping smoke/in/synthetic.csv.mapping.json --out smoke/pack --format json,html,docx --templates T1,T7,T8 --offline | tee run.txt
          rc=${PIPESTATUS[0]}
          set -e
          test "${rc}" = "4"
          grep -q "T1.docx, T7.html, T7.docx, T8.html, T8.docx" run.txt
          test -s smoke/pack/run.json
          test ! -e smoke/pack/T1.docx

  offline-namespace:
    # A-P2 (build day 8, lane A; D1 section 6, F19): the whole `proofpack run` on the
    # synthetic cohort inside a user namespace with no network (`unshare -rn`; if the
    # runner forbids unprivileged user namespaces, `sudo unshare -n`). First with
    # --offline: exit 0, run.json written, "telemetry skipped (--offline)". Then WITHOUT
    # --offline in the same kind of namespace: the send is expected to fail at the name
    # lookup, so the run should print one [W16] line, still exit 0 and still write run.json
    # (expected, not measured: this job had not run anywhere as of 23 September 2026 - the
    # branch has not reached this repository's CI). The venv is used
    # directly (.venv/bin/python) so nothing inside the namespace asks uv for the network.
    name: proofpack run inside unshare -rn (no network)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --all-groups --locked
      - name: full run with --offline, then without, each inside a network namespace
        run: |
          set -euo pipefail
          if unshare -rn true 2>/dev/null; then
            NS="unshare -rn"
          else
            echo "unprivileged user namespaces are unavailable on this runner; using sudo unshare -n"
            NS="sudo unshare -n"
          fi
          echo "namespace command: $NS"
          if $NS .venv/bin/python -c "import socket; socket.getaddrinfo('proofpack.globalphoenix.co.uk', 443)" 2>/dev/null; then
            echo "the namespace still resolves names; this job would prove nothing"
            exit 1
          fi
          echo "name lookup fails inside the namespace, as required"
          $NS .venv/bin/python scripts/ci_namespace_run.py --offline | tee offline.txt
          grep -q "telemetry skipped (--offline); nothing was sent" offline.txt
          grep -q "namespace run: --offline exit=0 run.json=written" offline.txt
          $NS .venv/bin/python scripts/ci_namespace_run.py --online | tee online.txt
          grep -q "\[W16\] telemetry not sent (" online.txt
          grep -q "namespace run: --online exit=0 run.json=written" online.txt
          echo "$NS" > namespace.txt
      # E13 (build day 13, F19; section 10 gate 8): the F19 egress-byte tests run inside the
      # same kind of namespace, and the job's logs are uploaded as the artefact
      # f19-offline-namespace that row F19 of fixtures_report.json names
      # (proofpack.f19.CI_ARTEFACT). The fixtures report does not know this job's run id.
      - name: F19 egress-byte tests inside the network namespace
        run: |
          set -euo pipefail
          NS="$(cat namespace.txt)"
          $NS .venv/bin/python -m pytest -q -p no:cacheprovider tests/test_f19_egress_bytes.py | tee f19_pytest.txt
      - name: upload the F19 namespace logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: f19-offline-namespace
          path: |
            namespace.txt
            offline.txt
            online.txt
            f19_pytest.txt
          if-no-files-found: error

  docker-smoke:
    # A-P3 (build day 9, lane A): the reference-platform image (Dockerfile: python:3.12-slim,
    # linux/amd64) built from the wheel and the hash-pinned lock, and the engine run inside
    # it with no network: doctor, fixtures, one run on the synthetic sample (exit 4: no
    # licence in the image, run.json written) and F17 (scripts/f17_determinism.py, two runs
    # of 5,000 rows compared under the three-key mask). No push: this job has no packages
    # permission and names no registry; the GHCR push is release.yml's, on a tag. In run
    # 36005620750 (24 September 2026, at 78ae8dc) the steps up to and including the build
    # completed, the digest step failed and the smoke step did not start.
    name: Docker image smoke (linux/amd64, no push)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv build --wheel --out-dir dist
      - run: uv export --locked --no-dev --extra stats --no-emit-project --format requirements-txt --output-file requirements.lock
      - name: build the image (the build log is kept in docker-build.log)
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 -t proofpack:ci . --progress plain 2>&1 | tee docker-build.log
      # A-P3 repair 3 (CI-3): in run 36005620750 (24 September 2026) `docker image inspect
      # python:3.12-slim` after the build answered "No such image: python:3.12-slim"; the
      # build log shows it resolving and pulling the base itself. This step greps the base
      # reference from the build log (tests/test_ap3_repair3.py::
      # test_ci3_the_digest_step_reads_the_build_log feeds it three lines of that log).
      # Written at 5440295, after run 36005620750.
      - name: record the base image digest (the Dockerfile pin is [unverified] until this is read)
        run: |
          set -euo pipefail
          grep -o -m1 -E 'docker\.io/library/python:3\.12-slim@sha256:[0-9a-f]{64}' docker-build.log
      - name: smoke inside the image with --network none
        run: |
          set -euo pipefail
          mkdir -p smoke && chmod 777 smoke
          docker run --rm --network none proofpack:ci doctor --offline
          docker run --rm --network none -v "$PWD/smoke:/work" -w /work proofpack:ci fixtures --offline --out /work/fixtures
          docker run --rm --network none -v "$PWD:/src:ro" -v "$PWD/smoke:/work" -w /work --entrypoint python proofpack:ci /src/scripts/f17_determinism.py --out /work/in --n 400 --inputs-only
          set +e
          docker run --rm --network none -v "$PWD/smoke:/work" -w /work proofpack:ci run --input /work/in/synthetic.csv --criteria /work/in/criteria.yaml --mapping /work/in/synthetic.csv.mapping.json --out /work/pack --format json --offline
          rc=$?
          set -e
          echo "proofpack run exit code in the image: ${rc} (4 = no licence installed; run.json is still written)"
          test "${rc}" = "4"
          test -s smoke/pack/run.json
          docker run --rm --network none -v "$PWD:/src:ro" -v "$PWD/smoke:/work" -w /work --entrypoint python proofpack:ci /src/scripts/f17_determinism.py --out /work/f17 --n 5000
      # E13 (build day 13, F17; section 10 gate 3): the same 5,000-row run twice on the image
      # built above, each in its own container with --network none (a fresh
      # /home/proofpack, so no licence and an empty ledger: exit 4, run.json written), then
      # the two directories compared inside the image by proofpack.f17.compare: run.json
      # bytes and the manifest hash with run_id, started and duration_s masked (each must
      # occur exactly once), pseudonyms.json with run_id masked, ingest_report.json and the
      # file lists. Any other difference, or a manifest that does not record
      # linux-x86_64-cp312, fails the step. Both run.json files and f17_result.json are
      # uploaded as the artefact f17-reference-image (proofpack.f17.CI_ARTEFACT). Written at
      # build day 13; it had not run when written.
      - name: F17 on the reference image (two runs, --network none, compared)
        run: |
          set -euo pipefail
          docker run --rm --network none -v "$PWD:/src:ro" -v "$PWD/smoke:/work" -w /work --entrypoint python proofpack:ci /src/scripts/f17_determinism.py --out /work/f17in --n 5000 --inputs-only
          for i in 1 2; do
            set +e
            docker run --rm --network none -v "$PWD/smoke:/work" -w /work proofpack:ci run --input /work/f17in/synthetic.csv --criteria /work/f17in/criteria.yaml --mapping /work/f17in/synthetic.csv.mapping.json --out /work/f17ref/run$i --format json --offline
            rc=$?
            set -e
            echo "F17 reference-image run $i exit code: ${rc} (4 = no licence installed; run.json is still written)"
            test "${rc}" = "4"
            test -s "smoke/f17ref/run$i/run.json"
          done
          docker run --rm --network none -v "$PWD:/src:ro" -v "$PWD/smoke:/work" -w /work --entrypoint python proofpack:ci /src/scripts/f17_determinism.py --out /work/f17ref --compare-dirs /work/f17ref/run1 /work/f17ref/run2 --require-reference-platform --where "ci.yml docker-smoke: two containers of the image proofpack:ci, no network"
      - name: upload the F17 reference-image runs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: f17-reference-image
          path: |
            smoke/f17ref/run1/run.json
            smoke/f17ref/run2/run.json
            smoke/f17ref/f17_result.json
          if-no-files-found: error

  audit:
    name: pip-audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --all-groups --locked
      # --skip-editable: the local package is installed editable by uv sync
      # and is not on PyPI; pip-audit cannot audit it ('Dependency not found
      # on PyPI', run 35005047083, 15 Sept). --strict is off because it fails
      # the audit on any skipped distribution, including that one ('proofpack:
      # distribution marked as editable', run 35377806719, 18 Sept); every
      # other dependency in uv.lock is still audited.
      - name: pip-audit against the locked environment
        run: uv run pip-audit --skip-editable --progress-spinner off

  wheel:
    name: wheel artefact
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv build --wheel --out-dir dist
      - name: wheel contains packaged schemas
        run: |
          uv run --no-project --with dist/*.whl python - <<'EOF'
          from proofpack.resources import resource_path
          for n in ("schema_v1.json", "criteria_schema.json", "claims_schema.json",
                    "egress_schema.json", "output_schema_v1.json", "guidance_map_v1.csv",
                    "tokens.json"):
              p = resource_path(n)
              assert "_schema" in str(p), p
          print("packaged resources ok")
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: proofpack-wheel-${{ github.sha }}
          path: dist/*.whl
          if-no-files-found: error

  import-without-scipy:
    name: import proofpack (scipy uninstalled)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - name: clean venv with runtime deps only (no dev group, no stats extra)
        run: |
          uv venv --python ${{ env.PYTHON_VERSION }} .venv-noscipy
          uv pip install --python .venv-noscipy/bin/python .
          uv pip uninstall --python .venv-noscipy/bin/python scipy || true
      - name: scipy must be absent, proofpack must import, doctor must pass
        run: |
          .venv-noscipy/bin/python - <<'EOF'
          import importlib.util, sys
          assert importlib.util.find_spec("scipy") is None, "scipy is installed; job is invalid"
          import proofpack, proofpack.cli, proofpack.gates, proofpack.io.schema
          import proofpack.io.declare, proofpack.io.mapping, proofpack.doctor
          import proofpack.stats.proportions, proofpack.stats.discrimination
          import proofpack.stats.bootstrap
          import numpy as np
          from proofpack.stats.bootstrap import stratified_by_outcome, bootstrap_percentile
          from proofpack.stats.discrimination import auroc_mann_whitney
          y = np.array([True] * 5 + [False] * 5)
          s = np.array([0.9, 0.8, 0.7, 0.6, 0.35, 0.75, 0.5, 0.4, 0.3, 0.2])
          draw = bootstrap_percentile(
              lambda i: auroc_mann_whitney(s[i], y[i]),
              stratified_by_outcome(y),
              np.random.default_rng(20240101),
              2000,
          )
          assert (round(draw.ci_lo, 10), round(draw.ci_hi, 10)) == (0.44, 1.0), draw
          assert "scipy" not in sys.modules
          print("import proofpack ok without scipy", proofpack.__version__)
          EOF
          .venv-noscipy/bin/proofpack doctor --offline

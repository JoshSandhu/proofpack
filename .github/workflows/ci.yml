name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  UV_VERSION: "0.8.17"
  PYTHON_VERSION: "3.12"

jobs:
  test:
    name: pytest + ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --all-groups --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: pytest (all markers)
        run: uv run pytest -q -p no:cacheprovider
      - name: pytest day1 marker only (definition of done)
        run: uv run pytest -q -p no:cacheprovider -m day1
      - name: doctor in the CI venv
        run: uv run proofpack doctor --offline

  audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --all-groups --locked
      - name: pip-audit against the locked environment
        run: uv run pip-audit --strict --progress-spinner off

  wheel:
    name: wheel artefact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv build --wheel --out-dir dist
      - name: wheel contains packaged schemas
        run: |
          uv run --no-project --with dist/*.whl python - <<'EOF'
          from proofpack.resources import resource_path
          for n in ("schema_v1.json", "criteria_schema.json", "claims_schema.json",
                    "egress_schema.json", "guidance_map_v1.csv"):
              p = resource_path(n)
              assert "_schema" in str(p), p
          print("packaged resources ok")
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: proofpack-wheel-${{ github.sha }}
          path: dist/*.whl
          if-no-files-found: error

  import-without-scipy:
    name: import proofpack (scipy uninstalled)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - name: clean venv with runtime deps only (no dev group, no stats extra)
        run: |
          uv venv --python ${{ env.PYTHON_VERSION }} .venv-noscipy
          uv pip install --python .venv-noscipy/bin/python .
          uv pip uninstall --python .venv-noscipy/bin/python scipy || true
      - name: scipy must be absent, proofpack must import, doctor must pass
        run: |
          .venv-noscipy/bin/python - <<'EOF'
          import importlib.util, sys
          assert importlib.util.find_spec("scipy") is None, "scipy is installed; job is invalid"
          import proofpack, proofpack.cli, proofpack.gates, proofpack.io.schema
          import proofpack.io.declare, proofpack.io.mapping, proofpack.doctor
          assert "scipy" not in sys.modules
          print("import proofpack ok without scipy", proofpack.__version__)
          EOF
          .venv-noscipy/bin/proofpack doctor --offline

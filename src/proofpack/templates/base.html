{# ProofPack page furniture (D4 section 1.5; D5 section 3.5). The one <style> block below
   takes every colour, type and spacing value from the theme's custom properties, inlined
   by proofpack.render.theme from design/tokens.json; no literal colour, no @import, no
   url(), no <link>, no <script>, no external font. The footer macro repeats at the end of
   every page section (screen) and once as the fixed print footer. #}
{% macro page_footer() -%}
<footer class="page-footer"><p class="disclaimer disclaimer-short">{{ footer }}</p>{% if watermark %}<p class="watermark">{{ watermark }}</p>{% endif %}</footer>
{%- endmacro %}
{# DEC-62: the model name and version are the manufacturer's words, inside .customer-text #}
{% macro page_header() -%}
<header class="page-header"><span class="customer-text">{{ header_customer }}</span> · {{ header_engine }}</header>
{%- endmacro %}
{% macro margin_note(ref) -%}
<aside class="margin-note{% if ref.draft %} draft{% endif %}">maps to <a href="#{{ ref.id }}">{{ ref.label }}</a> · section {{ ref.section }} · eSTAR: {{ ref.estar }}</aside>
{%- endmacro %}
{# D5 section 3.5 furniture (build day 9). The cover stamp prints each mark the manifest
   carries, spelled as the engine's constants spell it (proofpack.scope, the licence
   module); the placeholder box prints proofpack.scope.PLACEHOLDER for a customer-text
   slot with no text, or the engine's own line for a section with no data; the
   Manufacturer-text block labels the customer's words. #}
{% macro cover_stamps() -%}
{% for mark in marks %}<p class="stamp" data-mark="{{ mark.kind }}">{{ mark.text }}</p>{% endfor %}
{%- endmacro %}
{% from "_furniture.html" import placeholder, no_data, manufacturer_text %}
<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }}</title>
<style>
{{ css }}
html { font-size: var(--pp-type-body-px); }
body { margin: 0; background: var(--pp-color-bg); color: var(--pp-color-ink); font-family: var(--pp-type-text); line-height: var(--pp-type-line-height-body); font-size: var(--pp-type-scale-body); }
.page { max-width: var(--pp-layout-wrap); margin: 0 auto; padding: var(--pp-space-6) var(--pp-space-5); border-bottom: var(--pp-layout-rule) solid var(--pp-color-line); page-break-after: always; break-after: page; }
.page-header { font-size: var(--pp-type-scale-strip); color: var(--pp-color-ink-soft); text-transform: uppercase; letter-spacing: var(--pp-type-tracking-uppercase); border-bottom: var(--pp-layout-rule) solid var(--pp-color-line); padding-bottom: var(--pp-space-2); margin-bottom: var(--pp-space-5); }
.page-footer { margin-top: var(--pp-space-6); padding-top: var(--pp-space-3); border-top: var(--pp-layout-rule) solid var(--pp-color-line); font-size: var(--pp-type-scale-footnote); color: var(--pp-color-ink-soft); }
.print-footer { display: none; }
h1 { font-size: var(--pp-type-scale-h1); line-height: var(--pp-type-line-height-headings); margin: 0 0 var(--pp-space-4); }
h2 { font-size: var(--pp-type-scale-h2); line-height: var(--pp-type-line-height-headings); margin: var(--pp-space-6) 0 var(--pp-space-3); }
h3 { font-size: var(--pp-type-scale-h3); line-height: var(--pp-type-line-height-headings); margin: var(--pp-space-5) 0 var(--pp-space-2); }
p, li { max-width: var(--pp-layout-measure); }
table { border-collapse: collapse; width: 100%; font-size: var(--pp-type-scale-table); line-height: var(--pp-type-line-height-tables); font-variant-numeric: var(--pp-type-numeric); margin: var(--pp-space-3) 0; }
th, td { text-align: left; vertical-align: top; padding: var(--pp-space-1) var(--pp-space-2); border-bottom: var(--pp-layout-rule) solid var(--pp-color-line); }
thead { display: table-header-group; }
th { background: var(--pp-color-bg-soft); font-weight: 600; }
td.num, th.num { text-align: right; }
caption { text-align: left; font-size: var(--pp-type-scale-footnote); color: var(--pp-color-ink-soft); padding: var(--pp-space-1) 0; caption-side: top; }
.table-wrap { overflow-x: auto; }
code, pre, .mono { font-family: var(--pp-type-mono); }
pre { background: var(--pp-color-bg-inset); padding: var(--pp-space-3); border-radius: var(--pp-radius-code); overflow-x: auto; font-size: var(--pp-type-scale-table); }
.customer-text { border-left: var(--pp-layout-rule) solid var(--pp-color-ink-faint); padding-left: var(--pp-space-3); margin: var(--pp-space-2) 0; color: var(--pp-color-ink-soft); unicode-bidi: isolate; }
.customer-text .label { display: block; font-size: var(--pp-type-scale-tag); text-transform: uppercase; letter-spacing: var(--pp-type-tracking-uppercase); color: var(--pp-color-ink-faint); }
.margin-note { font-size: var(--pp-type-scale-footnote); color: var(--pp-color-ink-soft); border-left: var(--pp-layout-rule) solid var(--pp-color-line); padding-left: var(--pp-space-2); margin: var(--pp-space-1) 0 var(--pp-space-3); }
.margin-note.draft { color: var(--pp-color-honesty); border-left-color: var(--pp-color-honesty); }
.margin-note a { color: inherit; }
.disclaimer { color: var(--pp-color-ink-soft); }
.disclaimer-long { max-width: var(--pp-layout-measure); }
.watermark { font-weight: 700; color: var(--pp-color-honesty); background: var(--pp-color-honesty-bg); display: inline-block; padding: var(--pp-space-1) var(--pp-space-2); border-radius: var(--pp-radius-tag); text-transform: uppercase; letter-spacing: var(--pp-type-tracking-uppercase); }
.stamp { border: var(--pp-layout-rule) solid var(--pp-color-honesty); color: var(--pp-color-honesty); display: inline-block; padding: var(--pp-space-2) var(--pp-space-3); border-radius: var(--pp-radius-card); margin: var(--pp-space-3) 0; }
.cover-note { font-size: var(--pp-type-scale-footnote); color: var(--pp-color-ink-soft); }
.tag { font-size: var(--pp-type-scale-tag); text-transform: uppercase; letter-spacing: var(--pp-type-tracking-uppercase); background: var(--pp-color-bg-inset); border-radius: var(--pp-radius-tag); padding: 0 var(--pp-space-1); }
.highlight { background: var(--pp-color-brand-soft); }
td.status { font-weight: 600; }
.narrative-footer { font-size: var(--pp-type-scale-footnote); color: var(--pp-color-ink-soft); font-style: italic; }
.placeholder { border: var(--pp-layout-rule) dashed var(--pp-color-honesty); background: var(--pp-color-honesty-bg); color: var(--pp-color-honesty); padding: var(--pp-space-2) var(--pp-space-3); border-radius: var(--pp-radius-card); margin: var(--pp-space-2) 0; max-width: var(--pp-layout-measure); }
.customer-text.inline { display: inline; border-left: 0; padding-left: 0; margin: 0; }
.unverified { font-family: var(--pp-type-mono); color: var(--pp-color-honesty); }
.narrative p { max-width: var(--pp-layout-measure); }
figure.figure { margin: var(--pp-space-4) 0; }
figure.figure svg { max-width: 100%; height: auto; color: var(--pp-color-ink); }
figure.figure figcaption { font-size: var(--pp-type-scale-footnote); color: var(--pp-color-ink-soft); max-width: var(--pp-layout-measure); }
a:focus, button:focus { outline: var(--pp-layout-focus) var(--pp-color-brand); outline-offset: var(--pp-layout-focus-offset); }
{% include "_print.css.j2" %}</style>
</head>
<body>
{% block pages %}{% endblock %}
<div class="print-footer"><p class="disclaimer disclaimer-short">{{ footer }}</p>{% if watermark %}<p class="watermark">{{ watermark }}</p>{% endif %}</div>
</body>
</html>

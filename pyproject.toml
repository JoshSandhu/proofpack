[project]
name = "proofpack"
version = "0.1.0.dev1"
description = "ProofPack engine: validated ingest, declarations and statistical evidence packs for AI-enabled medical devices"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Global Phoenix Solutions Ltd" }]
dependencies = [
    "numpy>=2.0",
    "pyyaml>=6.0",
    "jsonschema>=4.23",
    # Ed25519 licence verification (D1 section 7, build day 7). Imported inside
    # proofpack.licence.verify only: `import proofpack` works without it.
    "cryptography>=42",
    # HTML rendering (D1 section 3.1 render.*, build day 8). Imported inside
    # proofpack.render.html only: `import proofpack` and `import proofpack.render` work
    # without it (tests/test_render_theme.py hides it from sys.modules).
    "jinja2>=3.1",
]

[project.optional-dependencies]
# scipy is an optional acceleration/oracle dependency; `import proofpack` must work without it.
stats = ["scipy>=1.14"]

[project.scripts]
proofpack = "proofpack.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.112",
    "ruff>=0.6",
    "pip-audit>=2.7",
    "scipy>=1.14",
    # test-only oracles: never imported by src/proofpack (asserted in test_no_oracle_leaks)
    "statsmodels>=0.14",
    "scikit-learn>=1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/proofpack"]

[tool.hatch.build.targets.wheel.force-include]
"schema/schema_v1.json" = "proofpack/_schema/schema_v1.json"
"schema/criteria_schema.json" = "proofpack/_schema/criteria_schema.json"
"schema/claims_schema.json" = "proofpack/_schema/claims_schema.json"
"schema/egress_schema.json" = "proofpack/_schema/egress_schema.json"
"schema/output_schema_v1.json" = "proofpack/_schema/output_schema_v1.json"
"design/guidance_map_v1.csv" = "proofpack/_schema/guidance_map_v1.csv"
# D5 section 4: the theme ships in the wheel beside the guidance map (three files: this
# line, design/tokens.json, the resources.py entry); tests/test_render_theme.py installs a
# built wheel into a fresh venv and asserts resource_path("tokens.json") resolves inside it.
"design/tokens.json" = "proofpack/_schema/tokens.json"

[tool.hatch.build.targets.sdist]
include = ["src/proofpack", "schema", "fixtures", "README.md", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N"]
ignore = ["N818"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "day1: Day 1 (E1) validated ingest and declarations",
    "day2: Day 2 (E2) proportions - Wilson, Clopper-Pearson, Newcombe",
    "day3: Day 3 (E3) discrimination - AUROC, DeLong via Sun & Xu",
    "day4: Day 4 (E4) bootstrap - stratified and clustered resampling, percentile CIs",
    "day5: Day 5",
    "day6: Day 6",
    "day7: Day 7",
    "day8: Day 8 (E8) claims, checker, HTML renderer, T8, tokens.json",
    "day9: Day 9",
    "day10: Day 10",
    "fixture: named fixture register entries (F1-F21)",
    "ap2: A-P2 egress, telemetry and --offline (build day 8, lane A); every ap2 test also carries day8",
    "slow: slow tests",
]
addopts = "-ra"

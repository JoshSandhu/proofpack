schema_version: 1
model:
  name: f5-fixture-classifier
  version: '1.3'
  prior_version: '1.2'
  udi_di: null
task: binary
classes:
  positive: '1'
  negative: '0'
score:
  type: probability
  orientation: higher_is_positive
operating_points:
- id: op1
  threshold: 0.5
  rule: '>='
  provenance: prespecified_sap
  source: R2 section 9 F5 (fixture)
reference_standard:
  type: reference_standard
  description: fixture labels
indeterminates:
  policy: none_present
  values: []
clustering:
  unit: none
  declared_by: fixture
prevalence:
- label: fixture
  value: 0.5
  source: fixture
subgroups:
- attribute: sex
  prespecified: true
  source: fixture
  reference_level: M
criteria:
- id: C1
  metric: sensitivity
  operating_point: op1
  scope: overall
  statistic: ci_lower_bound
  comparator: '>='
  value: 0.7
  author: F5 fixture author
  date: '2026-09-25'
  justification: a point criterion beside the paired one, so T2-2 prints both types
- id: C2
  metric: accuracy
  type: paired_difference_vs_prior
  operating_point: op1
  scope: overall
  statistic: ci_lower_bound
  comparator: '>='
  value: -0.05
  author: F5 fixture author
  date: '2026-09-25'
  justification: 'the brief''s acceptance test: the F5 accuracy difference of -0.08
    against a margin of -0.05 is not met'
ledger:
  warn_after_acceptance_runs: 3
egress:
  telemetry: false
bootstrap:
  B: 200
  seed: 20240101
  interval: percentile

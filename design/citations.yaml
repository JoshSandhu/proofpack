# Citations the T7 methods appendix prints (D4 section 10 items 12-13; build day 9, E9).
#
# One entry per reference. T7 lists an entry under "Library and reference citations" when
# the run used a method or block it names in used_by (method ids are Number.method values;
# the words subgroups, calibration, fairness, clustered and prevalence name a block of
# run.json), and lists every entry with verified: false under "Open verification items".
#
# verified is true only when the reference was read in its primary source and the reading
# is recorded; no entry here meets that bar in the engine repository on 24 September 2026,
# so every entry is false and T7 prints each one "citation pending verification" with its
# [unverified] marking kept (CLAUDE.md: anything not checked against a primary source
# stays marked). The text of each entry is the spec's own wording (the source field names
# the line); no page, volume or title was added from memory.

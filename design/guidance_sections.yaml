# Where each `section` value in design/guidance_map_v1.csv came from (build day 15, E15 item 1).
#
# Every non-empty `section` in the map was transcribed on 8 October 2026 from the primary
# document named in the row's `document` column, fetched from the URL below that day. Nothing
# here was taken from memory, from the D4 seeds or from a secondary source: where D4 seeded a
# location and the document says otherwise, the document wins (FDA_AIDSF_CALIBRATION below).
#
# How a value is spelt: the headings as the document prints them, outermost first, joined by
# " > "; two separate locations are joined by "; ". A heading is quoted with its whitespace
# collapsed to single spaces and, for the AI-DSF draft, without the line number the PDF prints
# in its right margin (pypdf runs it onto the heading line). One heading drops a footnote
# reference (FDA_STAT2007_INDETERMINATE). Pages are the PDF's own page index, 1-based.
#
# tests/test_e15_sections.py reads this file: every non-empty `section` in the map has a row
# here with the document's url, date read and version line, `section` here equals the map's
# character for character, and every quoted heading appears in it.
#
